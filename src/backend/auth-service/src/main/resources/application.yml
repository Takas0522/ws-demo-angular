spring:
  application:
    name: auth-service
  
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOSTNAME:localhost}:5432/auth_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

server:
  port: 8081

# JWT Configuration
jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:/keys/private_key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:/keys/public_key.pem}
  expiration: 3600000  # 1 hour in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# Logging
logging:
  level:
    com.example.authservice: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
