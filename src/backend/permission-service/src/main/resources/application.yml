spring:
  application:
    name: permission-service
  
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOSTNAME:localhost}:5432/permission_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

server:
  port: 8083

# Logging
logging:
  level:
    com.example.permissionservice: DEBUG
    org.hibernate.SQL: DEBUG
